<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ball</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div id="container">
        <div id="field">
            <div id="ball"></div>
        </div>
        <div id="control">
            <button id="run" class="btn btn-success" onclick="runClick()">
                <span class="bi bi-play-fill"></span>&nbsp;Run
            </button>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <button id="None" class="btn btn-outline-primary active" onclick="picture('none')">None</button>
            <button id="Bas" class="btn btn-outline-primary active" onclick="picture('basketball')">Basketball</button>
            <button id="Foot" class="btn btn-outline-primary active" onclick="picture('football')">football</button>
            <button id="Vole" class="btn btn-outline-primary active" onclick="picture('voletball')">Voletball</button>
            <button id="Hu" class="btn btn-outline-primary active" onclick="picture('human')">Human</button>
            <button id="CartOon" class="btn btn-outline-primary active" onclick="picture('cartoon')">Cartoon</button>
            <button id="logoo" class="btn btn-outline-primary active" onclick="picture('logo')">Logo</button>
        </div>
    </div>


    <script src="./index.js"></script>
</body>
</html>
